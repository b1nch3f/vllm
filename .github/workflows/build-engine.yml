name: Build and Push Custom vLLM Engine

# Trigger the automation automatically every time you push code to your feature branch
on:
  push:
    branches: [ custom-engine ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Critical: Gives the runner permission to push to GHCR

    steps:
      # Checkout your custom code changes
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Set up Docker Buildx for cloud-native layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate directly into the GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically injected by GitHub

      # Compile from source and build the exact multi-stage production image
      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai # Targets the production entrypoint configuration layer
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vllm-custom:latest
          cache-from: type=gha # Leverages GitHub Actions built-in cloud network caching
          cache-to: type=gha,mode=max
          build-args: |
            torch_cuda_arch_list=8.9
